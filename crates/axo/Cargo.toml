[package]
name = "axo"
description = "Axo Terminal: a Vulkan-accelerated terminal built on aegle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "axo"
path = "src/main.rs"

[dependencies]
axo-term.workspace = true
axo-render.workspace = true
aegle.workspace = true
unicode-width = "0.2"

# The renderer aegle itself presents with, and therefore the one the terminal
# draws into. On Linux, aegle's default window backend is sdl3.
[target.'cfg(target_os = "linux")'.dependencies]
aegle = { workspace = true, features = ["vulkan", "sdl3"] }

[target.'cfg(target_os = "windows")'.dependencies]
aegle = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
aegle = { workspace = true, features = ["tiny-skia"] }
