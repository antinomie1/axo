[package]
name = "axo-term"
description = "Axo terminal core: PTY, VT parsing, grid, scrollback and selection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
unicode-width = "0.2"

# `vte` is gone from the binary; the differential test keeps it as the
# reference implementation the hand-written parser is checked against.
[dev-dependencies]
vte = { version = "0.15", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
