[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"

[workspace.dependencies]
axo-term = { path = "crates/axo-term" }
axo-render = { path = "crates/axo-render" }
# Exactly one aegle renderer per build. Crates add the target's renderer
# feature themselves: Vulkan (which also hosts the terminal's ash pipeline) on
# Linux and Windows, wgpu (Metal, hosting the terminal's wgpu pipeline) on macOS.
# aegle tracks its main branch; `cargo update -p aegle` moves Cargo.lock to the
# latest commit.
aegle = { git = "https://github.com/antinomie1/aegle", branch = "main", default-features = false, features = ["desktop"] }
aegle-glyph = { git = "https://github.com/antinomie1/aegle", branch = "main", features = ["scene"] }
aegle-text = { git = "https://github.com/antinomie1/aegle", branch = "main", features = ["scene"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

