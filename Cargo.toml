[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"

[workspace.dependencies]
axo-term = { path = "crates/axo-term" }
axo-render = { path = "crates/axo-render" }
# Exactly one aegle renderer per build. Crates add the target's renderer
# feature themselves: Vulkan (which also hosts the terminal's ash pipeline) on
# Linux and Windows, the software compositor on macOS, whose GPU backend is not
# wired up yet.
aegle = { git = "https://github.com/antinomie1/aegle", rev = "40a4b882c7b05f2e357bb9d7bec7daeefaa99745", default-features = false, features = ["desktop"] }
aegle-glyph = { git = "https://github.com/antinomie1/aegle", rev = "40a4b882c7b05f2e357bb9d7bec7daeefaa99745", features = ["scene"] }
aegle-text = { git = "https://github.com/antinomie1/aegle", rev = "40a4b882c7b05f2e357bb9d7bec7daeefaa99745", features = ["scene"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

