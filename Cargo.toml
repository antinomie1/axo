[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"

[workspace.dependencies]
axo-term = { path = "crates/axo-term" }
axo-render = { path = "crates/axo-render" }
# Exactly one aegle renderer per build. Crates add the target's renderer
# feature themselves: Vulkan (which also hosts the terminal's ash pipeline) on
# Linux and Windows, wgpu (Metal, hosting the terminal's wgpu pipeline) on macOS.
aegle = { git = "https://github.com/antinomie1/aegle", rev = "42f331a3b4d7da1421e1acfb9f14cc0186475751", default-features = false, features = ["desktop"] }
aegle-glyph = { git = "https://github.com/antinomie1/aegle", rev = "42f331a3b4d7da1421e1acfb9f14cc0186475751", features = ["scene"] }
aegle-text = { git = "https://github.com/antinomie1/aegle", rev = "42f331a3b4d7da1421e1acfb9f14cc0186475751", features = ["scene"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

