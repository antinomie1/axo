[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"

[workspace.dependencies]
axo-term = { path = "crates/axo-term" }
axo-render = { path = "crates/axo-render" }
# Exactly one aegle renderer per build: Vulkan, which also hosts the terminal's ash pipeline.
aegle = { git = "https://github.com/antinomie1/aegle", rev = "bc051d13f93ff92fd567e946f59d631dd466205a", default-features = false, features = ["desktop", "vulkan"] }
aegle-glyph = { git = "https://github.com/antinomie1/aegle", rev = "bc051d13f93ff92fd567e946f59d631dd466205a", features = ["scene"] }
aegle-text = { git = "https://github.com/antinomie1/aegle", rev = "bc051d13f93ff92fd567e946f59d631dd466205a", features = ["scene"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

